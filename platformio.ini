; M5StickC Plus2 / Plus 1.1 / M5 StickS3 – DJI Osmo Action remote
; Use env:m5stickc_plus2 for Plus2, env:m5stickc_plus11 for Plus 1.1, env:m5sticks3 for StickS3

[platformio]
src_dir = main

; ----- M5Stick C Plus2 (default) -----
[env:m5stickc_plus2]
platform = espressif32
framework = espidf
board = m5stick-c
monitor_speed = 115200
upload_speed = 500000

; ----- M5Stick C Plus 1.1 (different LCD pins: DC=23, RST=18) -----
[env:m5stickc_plus11]
platform = espressif32
framework = espidf
board = m5stick-c
monitor_speed = 115200
upload_speed = 500000
; upload_port = /dev/cu.usbserial-XXXX   ; uncomment and set if auto-detect fails
board_build.cmake_extra_args = -DM5STICKC_PLUS_11_BUILD=ON

; ----- M5 StickS3 (ESP32-S3, BMI270, Unit GPS on Grove PORT.A G9/G10) -----
[env:m5sticks3]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
; Slower upload avoids flaky USB; esptool docs suggest lowering baud if connect/write fails.
upload_speed = 115200
; ESP32-S3 USB-CDC on macOS often cannot set DTR/RTS (pySerial errno 6). Esptool then falls
; back to UnixTightReset and ioctl fails. --before no_reset skips that; you must put the
; StickS3 in download mode first (M5: hold side Reset ~2s until green LED blinks, release,
; run upload immediately). See https://docs.m5stack.com/en/arduino/m5sticks3/program
upload_flags =
    --before
    no_reset
    --after
    hard_reset
board_build.cmake_extra_args = -DM5STICKS3_BUILD=ON
board_build.sdkconfig_defaults = sdkconfig.defaults.m5sticks3
board_build.psram_type = opi
board_build.flash_mode = qio
